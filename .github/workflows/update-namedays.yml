name: Update Bulgarian Name Days Calendar

on:
  push:
    paths:
      - 'tools/namedays/**'
      - '.github/workflows/update-namedays.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install beautifulsoup4
      - name: Build calendar
        run: python tools/namedays/update_namedays.py
      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/namedays/calendar.ics
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "Update Bulgarian name days calendar"
            git push
          fi
