name: Update Promotion Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'tools/promotions/**'
      - '.github/workflows/update-promotions.yml'
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-promotion-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh promotion catalog
        run: node tools/promotions/update_promotions.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promotion-fallback.json
          if git diff --cached --quiet; then
            echo "No promotion changes"
          else
            git commit -m "Refresh promotion snapshot"
            git push
          fi
